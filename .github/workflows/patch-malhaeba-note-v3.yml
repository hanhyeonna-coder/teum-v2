name: Patch Malhaeba release fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-malhaeba-note-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply release fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # 1) Saved stories: seeded stories are valid when the user explicitly bookmarks them.
          old="const arr=(data||[]).map(x=>x.posts).filter(s=>s && !s.is_seed && (s.language||'ko')===currentLang);"
          new="const arr=(data||[]).map(x=>x.posts).filter(s=>s && (s.language||'ko')===currentLang);"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Saved-story filter anchor not found')

          # 2) Give the second/final sentence of each Malhaeba note a stronger ending.
          old_note="""function malhaebaNoteFor(post){
  const lang=currentLang==='en'?'en':'ko';
  const category=malhaebaNoteCategory(post);
  const list=MALHAEBA_NOTES[lang][category]||MALHAEBA_NOTES[lang].feelings;
  return list[stableNoteIndex(post.id,list.length)];
}"""
          new_note="""function malhaebaNoteFor(post){
  const lang=currentLang==='en'?'en':'ko';
  const category=malhaebaNoteCategory(post);
  const list=MALHAEBA_NOTES[lang][category]||MALHAEBA_NOTES[lang].feelings;
  const raw=list[stableNoteIndex(post.id,list.length)];
  return raw.replace(/[.!?。！？]\\s*$/, '!');
}"""
          if old_note in s:
              s=s.replace(old_note,new_note,1)
          elif "replace(/[.!?。！？]\\s*$/, '!')" not in s:
              raise SystemExit('Malhaeba note function anchor not found')

          # 3) Swipe back from story detail. Supports the requested left swipe anywhere,
          #    plus the familiar iOS-style right swipe from the left edge.
          swipe="""

let detailSwipeStartX=null;
let detailSwipeStartY=null;
let detailSwipeScreen='';
function handleDetailSwipeStart(e){
  if(e.touches.length!==1)return;
  const active=document.querySelector('.screen.active');
  if(!active || !['detail','recordDetail'].includes(active.id))return;
  if(e.target.closest('input,textarea,button,a'))return;
  detailSwipeStartX=e.touches[0].clientX;
  detailSwipeStartY=e.touches[0].clientY;
  detailSwipeScreen=active.id;
}
function handleDetailSwipeEnd(e){
  if(detailSwipeStartX===null || !detailSwipeScreen)return;
  const touch=e.changedTouches&&e.changedTouches[0];
  if(!touch){detailSwipeStartX=null;detailSwipeStartY=null;detailSwipeScreen='';return}
  const dx=touch.clientX-detailSwipeStartX;
  const dy=touch.clientY-detailSwipeStartY;
  const startedAtLeftEdge=detailSwipeStartX<=38;
  const horizontal=Math.abs(dx)>=72 && Math.abs(dx)>Math.abs(dy)*1.25;
  const requestedLeftSwipe=dx<=-72;
  const iosEdgeBack=dx>=72 && startedAtLeftEdge;
  const screen=detailSwipeScreen;
  detailSwipeStartX=null;detailSwipeStartY=null;detailSwipeScreen='';
  if(!horizontal || (!requestedLeftSwipe && !iosEdgeBack))return;
  if(screen==='detail') backFromStory();
  else if(screen==='recordDetail') show('records');
}
document.addEventListener('touchstart',handleDetailSwipeStart,{passive:true});
document.addEventListener('touchend',handleDetailSwipeEnd,{passive:true});
"""
          anchor="let initialAuthHandled=false;"
          if 'function handleDetailSwipeEnd' not in s:
              if anchor not in s: raise SystemExit('Swipe insertion anchor not found')
              s=s.replace(anchor,swipe+'\n'+anchor,1)

          p.write_text(s)

      - name: Verify patched source
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert "filter(s=>s && (s.language||'ko')===currentLang)" in s
          assert "filter(s=>s && !s.is_seed && (s.language||'ko')===currentLang)" not in s
          assert "replace(/[.!?。！？]\\s*$/, '!')" in s
          assert 'function handleDetailSwipeEnd' in s
          assert "if(screen==='detail') backFromStory();" in s
          assert "else if(screen==='recordDetail') show('records');" in s
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip()]
          if not inline: raise SystemExit('No inline script')
          Path('/tmp/app.js').write_text(inline[-1])
          print('release patch assertions passed')
      - name: JavaScript syntax check
        run: node --check /tmp/app.js
      - name: Commit patch
        run: |
          git config user.name "malhaeba-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix saved bookmarks add swipe back and strengthen notes"
          git push
