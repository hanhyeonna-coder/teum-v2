name: Patch Malhaeba release fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-malhaeba-note-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish audited interaction cleanup
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="s.isDb && s.user_id && s.user_id!==currentUser?.id"
          new="s.isDb && !s.is_seed && s.user_id && s.user_id!==currentUser?.id"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('Seed safety-control anchor not found')
          p.write_text(s)
      - name: Verify current release guards
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          checks=[
            "filter(s=>s && (s.language||'ko')===currentLang)",
            "replace(/[.!?。！？]\\s*$/, '!')",
            "function handleDetailSwipeEnd",
            "if(!currentStory?.isDb){showToast(tr('sampleReact'));return}",
            "if(!currentStory?.isDb){showToast(tr('sampleSave'));return}",
            "blockedUserIds=new Set",
            "s.isDb && !s.is_seed && s.user_id && s.user_id!==currentUser?.id"
          ]
          for x in checks: assert x in s, x
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip()]
          Path('/tmp/app.js').write_text(inline[-1])
      - name: JavaScript syntax check
        run: node --check /tmp/app.js
      - name: Commit patch
        run: |
          git config user.name "malhaeba-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Hide synthetic author moderation controls"
          git push
