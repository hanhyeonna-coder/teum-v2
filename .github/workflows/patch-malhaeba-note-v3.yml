name: Patch Malhaeba release fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-malhaeba-note-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply release fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="const arr=(data||[]).map(x=>x.posts).filter(s=>s && !s.is_seed && (s.language||'ko')===currentLang);"
          new="const arr=(data||[]).map(x=>x.posts).filter(s=>s && (s.language||'ko')===currentLang);"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Saved-story filter anchor not found')

          old_note="function malhaebaNoteFor(post){\n  const lang=currentLang==='en'?'en':'ko';\n  const category=malhaebaNoteCategory(post);\n  const list=MALHAEBA_NOTES[lang][category]||MALHAEBA_NOTES[lang].feelings;\n  return list[stableNoteIndex(post.id,list.length)];\n}"
          new_note="function malhaebaNoteFor(post){\n  const lang=currentLang==='en'?'en':'ko';\n  const category=malhaebaNoteCategory(post);\n  const list=MALHAEBA_NOTES[lang][category]||MALHAEBA_NOTES[lang].feelings;\n  const raw=list[stableNoteIndex(post.id,list.length)];\n  return raw.replace(/[.!?。！？]\\s*$/, '!');\n}"
          if old_note in s:
              s=s.replace(old_note,new_note,1)
          elif "replace(/[.!?。！？]\\s*$/, '!')" not in s:
              raise SystemExit('Malhaeba note function anchor not found')

          swipe=(
              "\n\nlet detailSwipeStartX=null;\n"
              "let detailSwipeStartY=null;\n"
              "let detailSwipeScreen='';\n"
              "function handleDetailSwipeStart(e){\n"
              "  if(e.touches.length!==1)return;\n"
              "  const active=document.querySelector('.screen.active');\n"
              "  if(!active || !['detail','recordDetail'].includes(active.id))return;\n"
              "  if(e.target.closest('input,textarea,button,a'))return;\n"
              "  detailSwipeStartX=e.touches[0].clientX;\n"
              "  detailSwipeStartY=e.touches[0].clientY;\n"
              "  detailSwipeScreen=active.id;\n"
              "}\n"
              "function handleDetailSwipeEnd(e){\n"
              "  if(detailSwipeStartX===null || !detailSwipeScreen)return;\n"
              "  const touch=e.changedTouches&&e.changedTouches[0];\n"
              "  if(!touch){detailSwipeStartX=null;detailSwipeStartY=null;detailSwipeScreen='';return}\n"
              "  const dx=touch.clientX-detailSwipeStartX;\n"
              "  const dy=touch.clientY-detailSwipeStartY;\n"
              "  const startedAtLeftEdge=detailSwipeStartX<=38;\n"
              "  const horizontal=Math.abs(dx)>=72 && Math.abs(dx)>Math.abs(dy)*1.25;\n"
              "  const requestedLeftSwipe=dx<=-72;\n"
              "  const iosEdgeBack=dx>=72 && startedAtLeftEdge;\n"
              "  const screen=detailSwipeScreen;\n"
              "  detailSwipeStartX=null;detailSwipeStartY=null;detailSwipeScreen='';\n"
              "  if(!horizontal || (!requestedLeftSwipe && !iosEdgeBack))return;\n"
              "  if(screen==='detail') backFromStory();\n"
              "  else if(screen==='recordDetail') show('records');\n"
              "}\n"
              "document.addEventListener('touchstart',handleDetailSwipeStart,{passive:true});\n"
              "document.addEventListener('touchend',handleDetailSwipeEnd,{passive:true});\n"
          )
          anchor="let initialAuthHandled=false;"
          if 'function handleDetailSwipeEnd' not in s:
              if anchor not in s: raise SystemExit('Swipe insertion anchor not found')
              s=s.replace(anchor,swipe+'\n'+anchor,1)

          p.write_text(s)

      - name: Verify patched source
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert "filter(s=>s && (s.language||'ko')===currentLang)" in s
          assert "filter(s=>s && !s.is_seed && (s.language||'ko')===currentLang)" not in s
          assert "replace(/[.!?。！？]\\s*$/, '!')" in s
          assert 'function handleDetailSwipeEnd' in s
          assert "if(screen==='detail') backFromStory();" in s
          assert "else if(screen==='recordDetail') show('records');" in s
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip()]
          if not inline: raise SystemExit('No inline script')
          Path('/tmp/app.js').write_text(inline[-1])
          print('release patch assertions passed')
      - name: JavaScript syntax check
        run: node --check /tmp/app.js
      - name: Commit patch
        run: |
          git config user.name "malhaeba-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix saved bookmarks add swipe back and strengthen notes"
          git push
