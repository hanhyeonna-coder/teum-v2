name: Apply Malhaeba patch

on:
  push:
    paths:
      - '.github/workflows/fix-saved-and-swipe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: python3 scripts/patch_account_flow.py
      - name: Check JavaScript
        run: |
          python3 -c "from pathlib import Path; import re; s=Path('index.html').read_text(); b=[x for x in re.findall(r'<script(?:[^>]*)>([\\s\\S]*?)</script>',s,re.I) if x.strip()]; Path('/tmp/app.js').write_text(b[-1])"
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Unify account linking and improve story matching"
          git push
