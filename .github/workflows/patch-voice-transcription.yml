name: Patch voice transcription

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_voice_transcription.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch index.html
        run: python scripts/patch_voice_transcription.py
      - name: Commit patched frontend
        run: |
          if git diff --quiet -- index.html; then
            echo "No frontend changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect voice recording to OpenAI transcription"
          git push
